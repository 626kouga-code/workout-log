# ローカル開発用のサービス（ポートは CLAUDE.md の固定ルールに従う）
services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workout_log
      MYSQL_USER: workout
      MYSQL_PASSWORD: workout
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  s3mock:
    image: adobe/s3mock:5.2
    ports:
      - "9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: workout-log-local

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI（受信箱）

volumes:
  mysql-data:
