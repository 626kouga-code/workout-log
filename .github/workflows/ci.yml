# PR ごとの CI（docs/09_ci-cd.md）。4 つのジョブがすべて成功しないと main にマージできない。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR・ブランチに続けて push したら、古い実行は取り消す
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ローカル（.env.example）と同じ値。CI の中だけで使うダミーで、秘密情報ではない。
env:
  APP_URL: http://localhost:3000
  DATABASE_URL: mysql://workout:workout@localhost:3306/workout_log
  DATABASE_URL_TEST: mysql://workout:workout@localhost:3306/workout_log
  S3_ENDPOINT: http://localhost:9090
  S3_BUCKET: workout-log-local
  S3_REGION: ap-northeast-1
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  MAIL_FROM: Workout Log <no-reply@workout-log.local>

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: workout_log
          MYSQL_USER: workout
          MYSQL_PASSWORD: workout
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-reports/junit.xml
      - name: テスト結果を残す（失敗したときだけ）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: test-reports/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: workout_log
          MYSQL_USER: workout
          MYSQL_PASSWORD: workout
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      s3mock:
        image: adobe/s3mock:5.2
        ports:
          - 9090:9090
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: workout-log-local
      mailpit:
        image: axllent/mailpit:v1.34
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - name: Playwright のブラウザを入れる
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: E2E のレポートを残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
